<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup didn't finish — IvvY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
  .state-wrap {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.25rem;
  }
  .state-wrap .lede { max-width: 46ch; }
  .state-mark {
    width: 3rem; height: 3rem;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--stop-bg);
    color: var(--stop);
  }
  .state-mark svg { width: 1.5rem; height: 1.5rem; }
  .state-actions { display: flex; gap: 0.75rem; align-items: center; }
</style>
<script>
  (function () {
    try {
      var t = localStorage.getItem('ivvy_theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  })();
</script>
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 4l6 9M18 4l-6 9M12 13v7" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-name">IvvY</span>
  </div>
</header>

<main class="page">
  <div class="state-wrap">
    <span class="state-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4M12 17v.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>
      </svg>
    </span>

    <h1 class="display">Setup didn't finish</h1>
    <p class="lede">Something went wrong while setting up your workspace, so we
      undid the half-finished setup rather than leave it in a broken state.
      Nothing was saved. Please try again in a few minutes.</p>

    <div class="state-actions">
      <a class="btn btn-solid" href="/login">Try again</a>
      <a class="btn btn-quiet" href="mailto:{{ contact_email }}?subject=IvvY%20setup%20failed">
        Contact support
      </a>
    </div>
  </div>
</main>

<footer class="foot">
  <p class="foot-note"><a href="/privacy">Privacy</a> · <a href="/support">Support</a></p>
</footer>

</body>
</html>
